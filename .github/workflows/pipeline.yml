name: Scheduled Discovery Pipeline

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push database updates back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Data Ingestion
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          cd backend
          PYTHONPATH=. python3 scripts/ingest.py

      - name: Run LLM Extraction & Embedding Pipeline
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          cd backend
          PYTHONPATH=. python3 scripts/run_pipeline.py

      - name: Commit and Push Updated Databases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          # Only commit and push if there are actual database changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data pipeline run: Updated databases" && git push)
